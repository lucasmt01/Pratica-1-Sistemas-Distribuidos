name: sd-docker

services:
  app:
    build: .
    image: sd-flask:latest
    ports:
      - "5050:5050"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - backend

networks:
  backend:
    name: sd-docker-rede
    driver: bridge

volumes:
  redis-data:
    name: sd-docker-redis-data
